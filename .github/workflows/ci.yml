name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API · unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Unit tests are pure (no network/DB); config only needs these to be present.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      COOKIE_SECRET: ci-only-secret
      GEMINI_API_KEY: ci-placeholder
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  web:
    name: Web · lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
